<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Shamia Shawarma — Cuisine syrienne à Orléans | Syrian kitchen in Orléans</title>
<meta name="description" content="Shamia Shawarma : shawarma syrien grillé à la broche, marinade maison, à Orléans. / Syrian spit-grilled shawarma, house-made marinade, in Orléans." />
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Oswald:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FBF1E1; --cream-dim:#F1E2C4; --charcoal:#1C1410; --charcoal-soft:#291D15;
    --ink:#241A12; --paprika:#C1440E; --paprika-dark:#9C350A; --saffron:#E3A73A;
    --saffron-soft:#F0C776; --olive:#6B7A3A;
    --display: "Fraunces","Iowan Old Style","Palatino Linotype","URW Palladio L",Palatino,Georgia,"Times New Roman",serif;
    --body: "Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono: ui-monospace,"SFMono-Regular","Cascadia Mono","Liberation Mono",Menlo,Consolas,monospace;
    --condensed: "Oswald","Arial Narrow",var(--body);
    --ease: cubic-bezier(.16,1,.3,1);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;scroll-padding-top:84px;-webkit-text-size-adjust:100%;text-size-adjust:100%;}
  html,body{max-width:100%;overflow-x:hidden;}
  header,main,footer,section{max-width:100vw;}
  body{background:var(--cream);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased;}
  img,svg{display:block;max-width:100%;}
  a{color:inherit;text-decoration:none;}
  button{font:inherit;cursor:pointer;background:none;border:none;color:inherit;}
  h1,h2,h3,h4{font-family:var(--display);font-weight:600;letter-spacing:-.01em;}
  .mono{font-family:var(--mono);}
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px;}
  section{padding:96px 0;scroll-margin-top:84px;}
  section[id]{scroll-margin-top:84px;}

  /* ---------- scroll reveal ---------- */
  .reveal{opacity:0;transform:translateY(28px);transition:opacity .8s var(--ease),transform .8s var(--ease);will-change:opacity,transform;}
  .reveal.in-view{opacity:1;transform:translateY(0);}
  .reveal-group .reveal:nth-child(1){transition-delay:.02s;}
  .reveal-group .reveal:nth-child(2){transition-delay:.10s;}
  .reveal-group .reveal:nth-child(3){transition-delay:.18s;}
  .reveal-group .reveal:nth-child(4){transition-delay:.26s;}
  .reveal-group .reveal:nth-child(5){transition-delay:.34s;}
  .reveal-group .reveal:nth-child(6){transition-delay:.42s;}
  @media (prefers-reduced-motion: reduce){.reveal{opacity:1!important;transform:none!important;transition:none!important;}}
  .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.25em;text-transform:uppercase;color:var(--paprika);}
  .eyebrow.light{color:var(--saffron);}
  .btn{display:inline-block;border-radius:999px;padding:14px 28px;font-weight:600;font-size:14px;transition:transform .18s cubic-bezier(.34,1.56,.64,1),background .18s ease,box-shadow .18s ease;}
  .btn:hover{transform:translateY(-2px) scale(1.03);}
  .btn:active{transform:scale(.94);}
  .btn-primary{background:var(--paprika);color:var(--cream);box-shadow:0 8px 20px -8px rgba(193,68,14,.6);}
  .btn-primary:hover{background:var(--paprika-dark);}
  .btn-outline-dark{border:1px solid rgba(36,26,18,.2);color:var(--ink);}
  .btn-outline-dark:hover{border-color:var(--paprika);color:var(--paprika);}
  .btn-outline-cream{border:1px solid rgba(251,241,225,.4);color:var(--cream);}
  .btn-outline-cream:hover{background:rgba(251,241,225,.1);}
  .btn-dark{background:var(--charcoal);color:var(--cream);}
  .btn-dark:hover{background:var(--ink);}

  @keyframes spin-slow{from{transform:rotate(0)}to{transform:rotate(360deg)}}
  .spin-slow{animation:spin-slow 14s linear infinite;}
  @keyframes rise{0%{transform:translateY(0) scaleX(1);opacity:.55}100%{transform:translateY(-38px) scaleX(1.4);opacity:0}}
  .rise{animation:rise 3.2s ease-out infinite;}
  @media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important;}}
  ::selection{background:var(--paprika);color:var(--cream);}

  /* placeholder art */
  .ph{position:relative;overflow:hidden;border-radius:16px;isolation:isolate;}
  .ph::after{content:"";position:absolute;inset:0;opacity:.2;background-image:repeating-linear-gradient(-10deg, var(--cream) 0 2px, transparent 2px 60px);}
  .ph .ph-smoke{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;gap:24px;padding-bottom:8px;}
  .ph .ph-smoke span{width:6px;border-radius:999px;background:rgba(251,241,225,.4);}
  .ph .ph-smoke span:nth-child(1){height:24px;animation:rise 3.2s ease-out infinite;}
  .ph .ph-smoke span:nth-child(2){height:32px;animation:rise 3.2s ease-out infinite .8s;}
  .ph .ph-smoke span:nth-child(3){height:20px;animation:rise 3.2s ease-out infinite 1.6s;}
  .ph .ph-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:0 16px;}
  .ph .ph-label span{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.2em;color:rgba(251,241,225,.92);}
  .ph-0{background:linear-gradient(135deg,var(--paprika),var(--saffron));}
  .ph-1{background:linear-gradient(135deg,var(--saffron),var(--olive));}
  .ph-2{background:linear-gradient(135deg,var(--charcoal),var(--paprika));}
  .ph-3{background:linear-gradient(135deg,var(--olive),var(--charcoal));}

  /* header */
  header{position:fixed;inset:0 0 auto 0;z-index:50;transition:background .3s ease,box-shadow .3s ease;}
  header .bar{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;max-width:1180px;margin:0 auto;}
  header.scrolled{background:rgba(251,241,225,.95);box-shadow:0 2px 16px rgba(0,0,0,.08);backdrop-filter:blur(6px);}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-badge{display:grid;place-items:center;width:36px;height:36px;border-radius:999px;border:1.5px solid var(--cream);}
  header.scrolled .brand-badge{border-color:var(--paprika);}
  .brand-name{font-family:var(--display);font-style:italic;font-size:18px;color:var(--cream);}
  header.scrolled .brand-name{color:var(--ink);}
  nav.desktop-nav{display:none;gap:32px;align-items:center;}
  nav.desktop-nav a{font-size:14px;font-weight:500;color:var(--cream);}
  header.scrolled nav.desktop-nav a{color:var(--ink);}
  nav.desktop-nav a:hover{color:var(--paprika);}
  .header-right{display:none;align-items:center;gap:16px;}
  .lang-toggle{display:flex;align-items:center;border-radius:999px;border:1px solid rgba(251,241,225,.3);padding:4px;font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:600;}
  header.scrolled .lang-toggle{border-color:rgba(36,26,18,.2);}
  .lang-toggle span{color:var(--cream);}
  header.scrolled .lang-toggle span{color:var(--ink);}
  .lang-toggle .opt{display:flex;align-items:center;justify-content:center;width:32px;height:24px;border-radius:999px;opacity:.5;transition:.2s;}
  .lang-toggle .opt.active{opacity:1;background:var(--paprika);color:var(--cream)!important;}
  .mobile-toggle{display:block;color:var(--cream);}
  header.scrolled .mobile-toggle{color:var(--ink);}
  .mobile-panel{max-height:0;overflow:hidden;background:var(--cream);border-top:0 solid rgba(36,26,18,.1);padding:0 20px;transition:max-height .38s var(--ease),padding .38s var(--ease),border-top-width .38s var(--ease);}
  .mobile-panel.open{max-height:420px;padding:20px;border-top-width:1px;}
  .mobile-panel a{display:block;padding:10px 0;font-weight:500;opacity:0;transform:translateY(-6px);transition:opacity .3s ease,transform .3s ease;}
  .mobile-panel.open a{opacity:1;transform:translateY(0);}
  .mobile-panel.open a:nth-child(1){transition-delay:.05s;}
  .mobile-panel.open a:nth-child(2){transition-delay:.1s;}
  .mobile-panel.open a:nth-child(3){transition-delay:.15s;}
  .mobile-panel.open a:nth-child(4){transition-delay:.2s;}
  .mobile-panel-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:16px;}
  @media (min-width:860px){
    nav.desktop-nav{display:flex;}
    .header-right{display:flex;}
    .mobile-toggle{display:none;}
  }

  /* hero */
  #hero{position:relative;min-height:100svh;display:flex;align-items:flex-end;overflow:hidden;background:var(--charcoal);padding:0;}
  #hero-bg{position:absolute;inset:0;}
  #hero-bg .ph{position:absolute;inset:0;border-radius:0;opacity:0;transform:scale(1.06);transition:opacity 1.3s ease,transform 7s linear;}
  #hero-bg .ph.active{opacity:1;transform:scale(1.16);}
  .hero-inner .eyebrow,.hero-inner h1,.hero-inner p.sub,.hero-inner .hero-cta,.hero-inner .hero-rating{opacity:0;transform:translateY(18px);animation:hero-in .9s var(--ease) forwards;}
  .hero-inner .eyebrow{animation-delay:.1s;}
  .hero-inner h1{animation-delay:.22s;}
  .hero-inner p.sub{animation-delay:.34s;}
  .hero-inner .hero-cta{animation-delay:.46s;}
  .hero-inner .hero-rating{animation-delay:.58s;}
  @keyframes hero-in{to{opacity:1;transform:translateY(0);}}
  @media (prefers-reduced-motion: reduce){.hero-inner .eyebrow,.hero-inner h1,.hero-inner p.sub,.hero-inner .hero-cta,.hero-inner .hero-rating{animation:none;opacity:1;transform:none;}}
  #hero-overlay{position:absolute;inset:0;background:linear-gradient(to top, var(--charcoal), rgba(28,20,16,.6) 55%, rgba(28,20,16,.2));}
  .hero-dots{position:absolute;right:24px;top:50%;transform:translateY(-50%);z-index:2;display:none;flex-direction:column;gap:8px;}
  .hero-dots button{width:10px;height:10px;border-radius:999px;background:rgba(251,241,225,.4);transition:.2s;}
  .hero-dots button.active{background:var(--saffron);transform:scale(1.25);}
  @media (min-width:860px){.hero-dots{display:flex;}}
  .hero-inner{position:relative;z-index:2;max-width:1180px;margin:0 auto;padding:160px 20px 96px;width:100%;}
  .hero-inner h1{color:var(--cream);font-style:italic;font-size:clamp(34px,6vw,58px);line-height:1.08;max-width:720px;margin-top:16px;}
  .hero-inner p.sub{color:rgba(251,241,225,.8);max-width:520px;margin-top:20px;font-size:17px;}
  .hero-cta{display:flex;flex-wrap:wrap;gap:16px;margin-top:32px;}
  .hero-rating{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:40px;color:var(--cream);}
  .rating-badge{display:grid;place-items:center;width:44px;height:44px;border-radius:999px;border:1px solid rgba(227,167,58,.5);color:var(--saffron);}
  .stars{color:var(--saffron);}

  /* grids / cards */
  .section-head{display:flex;flex-direction:column;gap:12px;align-items:flex-start;justify-content:space-between;margin-bottom:40px;}
  .section-head h2{font-style:italic;font-size:clamp(26px,4vw,36px);}
  @media (min-width:760px){.section-head{flex-direction:row;align-items:flex-end;}}

  /* featured marquee (Nos classiques) */
  .featured-marquee{overflow:hidden;-webkit-mask-image:linear-gradient(to right,transparent,#000 40px,#000 calc(100% - 40px),transparent);mask-image:linear-gradient(to right,transparent,#000 40px,#000 calc(100% - 40px),transparent);}
  .featured-track{display:flex;gap:24px;width:max-content;animation:featured-scroll 34s linear infinite;}
  .featured-track:hover,.featured-track:focus-within{animation-play-state:paused;}
  .featured-track .card{flex:0 0 260px;width:260px;}
  @media (min-width:640px){.featured-track .card{flex-basis:280px;width:280px;}}
  @keyframes featured-scroll{from{transform:translateX(0);}to{transform:translateX(-50%);}}
  @media (prefers-reduced-motion: reduce){.featured-track{animation:none;overflow-x:auto;}.featured-track [aria-hidden="true"]{display:none;}}
  .card{border:1px solid rgba(36,26,18,.1);border-radius:16px;background:rgba(255,255,255,.6);overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.03);transition:transform .18s cubic-bezier(.34,1.56,.64,1);}
  .card:hover{transform:translateY(-2px) scale(1.02);}
  .card .ph{height:176px;border-radius:0;}
  .card-body{padding:20px;}
  .card-body h4{font-size:19px;}
  .card-body p{margin-top:6px;font-size:14px;color:rgba(36,26,18,.6);}
  .card-foot{display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
  .price{font-family:var(--mono);font-size:14px;font-weight:600;color:var(--paprika);}
  .badge{position:absolute;top:12px;left:12px;background:rgba(28,20,16,.9);color:var(--cream);font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.1em;padding:4px 10px;border-radius:999px;}

  /* story */
  #histoire{background:var(--cream-dim);}
  .story-grid{display:grid;grid-template-columns:1fr;gap:56px;align-items:center;}
  @media (min-width:940px){.story-grid{grid-template-columns:1fr 1fr;}}
  .story-body p{margin-top:20px;max-width:560px;color:rgba(36,26,18,.7);}
  .feature-grid{display:grid;grid-template-columns:1fr;gap:24px;margin-top:40px;}
  @media (min-width:600px){.feature-grid{grid-template-columns:repeat(3,1fr);}}
  .feature-grid h4{margin-top:12px;font-size:16px;}
  .feature-grid p{margin-top:4px;font-size:14px;color:rgba(36,26,18,.6);}
  .story-photos{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .story-photos .ph:first-child{grid-column:span 2;height:220px;}
  .story-photos .ph{height:160px;}

  /* menu */
  #menu{background:var(--charcoal);color:var(--cream);}
  #menu .eyebrow{color:var(--saffron);}
  #menu h2{color:var(--cream);}
  .tabs{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:40px;}
  .tab{border-radius:999px;padding:10px 18px;font-size:14px;font-weight:500;background:rgba(251,241,225,.08);color:rgba(251,241,225,.7);transition:.18s;}
  .tab:hover{transform:translateY(-2px) scale(1.03);background:rgba(251,241,225,.15);}
  .tab.active{background:var(--paprika);color:var(--cream);}
  .menu-groups{margin-top:56px;display:flex;flex-direction:column;gap:56px;transition:opacity .25s ease;}
  .menu-groups.switching{opacity:0;}
  .menu-cat h3{font-style:italic;font-size:26px;color:var(--saffron);}
  .menu-note{text-align:center;margin-top:10px;font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:rgba(251,241,225,.45);}

  .menu-card-grid{margin-top:24px;display:grid;grid-template-columns:1fr;gap:20px;}
  @media (min-width:640px){.menu-card-grid{grid-template-columns:1fr 1fr;}}
  @media (min-width:980px){.menu-card-grid{grid-template-columns:repeat(3,1fr);}}
  .menu-card{background:var(--cream);border-radius:20px;padding:24px 26px;box-shadow:0 6px 20px -8px rgba(0,0,0,.35);transition:transform .18s cubic-bezier(.34,1.56,.64,1),box-shadow .18s ease;}
  .menu-card:hover{transform:translateY(-3px) scale(1.015);box-shadow:0 10px 28px -8px rgba(0,0,0,.45);}
  .menu-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
  .menu-card-name{font-family:var(--condensed);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.01em;color:var(--ink);line-height:1.15;overflow-wrap:anywhere;min-width:0;}
  .menu-card-top{min-width:0;}
  .menu-card-price{flex-shrink:0;background:var(--saffron);color:var(--ink);font-family:var(--mono);font-weight:600;font-size:13px;white-space:nowrap;border-radius:999px;padding:7px 14px;}
  .menu-card-desc{margin-top:12px;font-size:14px;line-height:1.5;color:rgba(36,26,18,.62);}

  /* reviews */
  #avis{background:var(--charcoal);color:var(--cream);}
  .rating-summary{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:24px 48px;margin-top:40px;}
  .rating-summary .num{font-family:var(--display);font-style:italic;font-size:36px;color:var(--saffron);}
  .rating-summary .lbl{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:rgba(251,241,225,.6);margin-top:4px;}
  .rating-sep{width:1px;height:48px;background:rgba(251,241,225,.2);}
  .see-all{display:block;text-align:center;margin-top:24px;color:var(--saffron);font-size:14px;}
  .see-all:hover{text-decoration:underline;}
  .reviews-grid{display:grid;grid-template-columns:1fr;gap:20px;margin-top:56px;}
  @media (min-width:700px){.reviews-grid{grid-template-columns:1fr 1fr;}}
  @media (min-width:1000px){.reviews-grid{grid-template-columns:repeat(3,1fr);}}
  .review-card{border:1px solid rgba(251,241,225,.1);background:rgba(251,241,225,.05);border-radius:16px;padding:24px;}
  .review-card .stars{font-size:13px;margin-top:6px;}
  .review-card p{margin-top:10px;font-size:14px;line-height:1.6;color:rgba(251,241,225,.85);}
  .review-author{display:flex;align-items:center;gap:12px;margin-top:20px;}
  .avatar{display:grid;place-items:center;width:36px;height:36px;border-radius:999px;background:rgba(193,68,14,.2);font-family:var(--mono);font-size:14px;color:var(--saffron);}
  .review-author .name{font-size:14px;font-weight:500;}
  .review-author .src{font-size:12px;color:rgba(251,241,225,.5);}

  /* where */
  #trouver{background:var(--cream-dim);}
  .where-grid{display:grid;grid-template-columns:1fr;gap:48px;}
  @media (min-width:940px){.where-grid{grid-template-columns:1fr 1fr;}}
  .info-row{display:flex;gap:16px;margin-top:24px;}
  .info-row svg{flex-shrink:0;margin-top:4px;color:var(--paprika);}
  .info-row .lbl{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:rgba(36,26,18,.4);}
  .info-row .val{margin-top:2px;}
  .info-row .val a{border-bottom:1px solid rgba(36,26,18,.2);transition:border-color .18s ease,color .18s ease;}
  .info-row .val a:hover{color:var(--paprika);border-color:var(--paprika);}
  .hours-list{margin-top:8px;display:flex;flex-direction:column;gap:6px;max-width:320px;}
  .hours-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;font-size:14px;padding-bottom:6px;border-bottom:1px dashed rgba(36,26,18,.12);}
  .hours-row:last-child{border-bottom:0;padding-bottom:0;}
  .hours-row span:first-child{color:rgba(36,26,18,.55);}
  .hours-row span:last-child{font-family:var(--mono);font-size:13px;font-weight:600;}
  .map-frame{border-radius:16px;overflow:hidden;border:1px solid rgba(36,26,18,.1);box-shadow:0 1px 3px rgba(0,0,0,.05);}
  .map-frame iframe{width:100%;height:340px;border:0;display:block;}

  /* order */
  #commander{position:relative;background:var(--charcoal);color:var(--cream);text-align:center;overflow:hidden;}
  #commander .platforms{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;margin-top:40px;}
  .plat-btn{border-radius:999px;padding:14px 28px;font-weight:600;font-size:14px;color:var(--cream);box-shadow:0 8px 24px -10px rgba(0,0,0,.6);}
  .plat-btn.uber{background:#000;}
  .plat-btn.uber:hover{background:#222;}
  .plat-btn.doordash{background:var(--paprika);}
  .plat-btn.doordash:hover{background:var(--paprika-dark);}
  .plat-btn.skip{background:var(--olive);}
  .plat-btn.skip:hover{background:#57642e;}

  footer{background:var(--ink);color:rgba(251,241,225,.8);padding:56px 0;}
  .footer-top{display:flex;flex-direction:column;gap:32px;justify-content:space-between;}
  @media (min-width:760px){.footer-top{flex-direction:row;align-items:center;}}
  .footer-top .brand-name{color:var(--cream);}
  .footer-top p{margin-top:8px;max-width:340px;font-size:14px;color:rgba(251,241,225,.5);}
  .footer-nav{display:flex;flex-wrap:wrap;gap:24px;font-size:14px;}
  .footer-nav a:hover{color:var(--saffron);}
  .footer-bottom{margin-top:40px;padding-top:24px;border-top:1px solid rgba(251,241,225,.1);display:flex;flex-direction:column;gap:8px;font-size:12px;color:rgba(251,241,225,.4);}
  @media (min-width:760px){.footer-bottom{flex-direction:row;align-items:center;justify-content:space-between;}}
  .footer-bottom .tag{font-family:var(--mono);text-transform:uppercase;letter-spacing:.05em;color:rgba(227,167,58,.7);}
</style>
</head>
<body>

<header id="site-header">
  <div class="bar">

  var featuredItems = featuredNames.map(function(n){ return allItems.filter(function(i){ return i.name.fr === n; })[0]; });

  var reviews = [
    { quote:{fr:"Portions généreuses, sauces savoureuses, et ouvert tard contrairement à bien d'autres shawarmas du coin — un client qui revient sans hésiter.", en:"Generous portions and tasty sauces, open later than most other local shawarma spots — a repeat customer through and through."}, author:"Pasha Y.", src:{fr:"Avis DoorDash", en:"DoorDash review"}, initial:"P" },
    { quote:{fr:"Le plat mixte bœuf et poulet a conquis un client épuisé après le travail : portions généreuses, livraison rapide et tout était encore frais à l'arrivée.", en:"The mixed beef and chicken plate won over a customer at the end of a long day — huge portions, fast delivery, and everything still tasted fresh."}, author:"Diane G.", src:{fr:"Avis DoorDash", en:"DoorDash review"}, initial:"D" },
    { quote:{fr:"Le poulet et bœuf shawarma est devenu son préféré à Gatineau, grâce à une viande bien grillée et une sauce particulièrement réussie.", en:"The chicken and beef shawarma became a new local favourite, thanks to well-charred meat and a sauce that stood out."}, author:"Sophie V.", src:{fr:"Avis DoorDash", en:"DoorDash review"}, initial:"S" },
    { quote:{fr:"Pour le prix, les portions sont copieuses et relativement santé — trois commandes plus tard, toujours aucune déception.", en:"For the price, portions are generous and reasonably healthy — three orders in, still nothing to complain about."}, author:"Raphael B.", src:{fr:"Avis DoorDash", en:"DoorDash review"}, initial:"R" },
    { quote:{fr:"Les samosas et le kebbeh se sont démarqués comme de vrais coups de cœur, avec un potentiel évident sur le reste du menu.", en:"The samosas and kebbeh stood out as clear highlights, with plenty of promise across the rest of the menu."}, author:"Marilou L.", src:{fr:"Avis DoorDash", en:"DoorDash review"}, initial:"M" }
  ];

  var badgeLabel = { bestseller:{fr:"Best-seller", en:"Best-seller"}, "new":{fr:"Nouveau", en:"New"} };
  var imgAlt = { fr:"Image à venir", en:"Photo coming soon" };
  function phClass(i){ return "ph ph-" + (i % 4); }
  function phMarkup(i){
    return '<div class="'+phClass(i)+'"><div class="ph-smoke"><span></span><span></span><span></span></div>' +
      '<div class="ph-label"><span data-fr="'+imgAlt.fr+'" data-en="'+imgAlt.en+'"></span></div></div>';
  }

  // ---------- Render: featured ----------
  var featuredGrid = document.getElementById("featured-grid");
  function buildFeaturedCard(item, i, duplicate){
    var badge = item.badge ? '<span class="badge" data-fr="'+badgeLabel[item.badge].fr+'" data-en="'+badgeLabel[item.badge].en+'"></span>' : "";
    var el = document.createElement("div");
    el.className = "card";
    if(duplicate) el.setAttribute("aria-hidden","true");
    el.innerHTML =
      '<div style="position:relative;">' + phMarkup(i) + badge + '</div>' +
      '<div class="card-body">' +
        '<h4 data-fr="'+item.name.fr+'" data-en="'+item.name.en+'"></h4>' +
        '<p data-fr="'+item.desc.fr+'" data-en="'+item.desc.en+'"></p>' +
        '<div class="card-foot"><span class="price">0.00 $</span>' +
        '<span class="mono" style="font-size:10px;text-transform:uppercase;letter-spacing:.1em;opacity:.4;" data-fr="'+imgAlt.fr+'" data-en="'+imgAlt.en+'"></span></div>' +
      '</div>';
    return el;
  }
  featuredItems.forEach(function(item, i){ featuredGrid.appendChild(buildFeaturedCard(item, i, false)); });
  // duplicate the set once for a seamless infinite loop
  featuredItems.forEach(function(item, i){ featuredGrid.appendChild(buildFeaturedCard(item, i, true)); });

  // ---------- Render: menu tabs + groups ----------
  var tabsEl = document.getElementById("menu-tabs");
  var groupsEl = document.getElementById("menu-groups");
  var activeCat = "all";

  var allTab = document.createElement("button");
  allTab.className = "tab active";
  allTab.setAttribute("data-fr","Tous"); allTab.setAttribute("data-en","All");
  allTab.onclick = function(){ setActiveTab("all"); };
  tabsEl.appendChild(allTab);

  menuCategories.forEach(function(cat){
    var b = document.createElement("button");
    b.className = "tab";
    b.setAttribute("data-fr", cat.label.fr);
    b.setAttribute("data-en", cat.label.en);
    b.onclick = function(){ setActiveTab(cat.id); };
    b.dataset.cat = cat.id;
    tabsEl.appendChild(b);
  });

  function setActiveTab(id){
    activeCat = id;
    Array.prototype.forEach.call(tabsEl.children, function(btn, idx){
      var isActive = (id === "all" && idx === 0) || btn.dataset.cat === id;
      btn.classList.toggle("active", isActive);
    });
    groupsEl.classList.add("switching");
    setTimeout(function(){
      renderMenuGroups();
      groupsEl.classList.remove("switching");
    }, 180);
  }

  function renderMenuGroups(){
    groupsEl.innerHTML = "";
    var cats = activeCat === "all" ? menuCategories : menuCategories.filter(function(c){ return c.id === activeCat; });
    cats.forEach(function(cat){
      var wrap = document.createElement("div");
      wrap.className = "menu-cat reveal";
      var h3 = document.createElement("h3");
      h3.setAttribute("data-fr", cat.label.fr); h3.setAttribute("data-en", cat.label.en);
      wrap.appendChild(h3);
      var grid = document.createElement("div");
      grid.className = "menu-card-grid reveal-group";
      cat.items.forEach(function(item){
        var card = document.createElement("div");
        card.className = "menu-card reveal";
        card.innerHTML =
          '<div class="menu-card-top">' +
            '<h4 class="menu-card-name" data-fr="'+item.name.fr+'" data-en="'+item.name.en+'"></h4>' +
            '<span class="menu-card-price">0,00 $</span>' +
          '</div>' +
          '<p class="menu-card-desc" data-fr="'+item.desc.fr+'" data-en="'+item.desc.en+'"></p>';
        grid.appendChild(card);
      });
      wrap.appendChild(grid);
      groupsEl.appendChild(wrap);
    });
    applyLang();
    observeReveals();
  }
  renderMenuGroups();

  // ---------- Render: reviews ----------
  var reviewsGrid = document.getElementById("reviews-grid");
  reviews.forEach(function(r){
    var el = document.createElement("div");
    el.className = "review-card reveal";
    el.innerHTML =
      '<div class="stars">★★★★★</div>' +
      '<p data-fr="'+r.quote.fr+'" data-en="'+r.quote.en+'"></p>' +
      '<div class="review-author"><span class="avatar">'+r.initial+'</span>' +
      '<div><div class="name">'+r.author+'</div><div class="src" data-fr="'+r.src.fr+'" data-en="'+r.src.en+'"></div></div></div>';
    reviewsGrid.appendChild(el);
  });

  // ---------- Hero carousel ----------
  var slides = [
    {fr:"Poulet mariné, grillé à la broche", en:"Marinated chicken, spit-grilled"},
    {fr:"Bœuf tranché fin, sauce à l'ail maison", en:"Thin-sliced beef, house garlic sauce"},
    {fr:"Pita chaud, toujours à la commande", en:"Warm pita, always made to order"},
    {fr:"Assiettes familiales pour toute la tablée", en:"Family platters for the whole table"}
  ];
  var heroBg = document.getElementById("hero-bg");
  var heroDots = document.getElementById("hero-dots");
  slides.forEach(function(s, i){
    var el = document.createElement("div");
    el.className = phClass(i) + (i === 0 ? " active" : "");
    el.innerHTML = '<div class="ph-smoke"><span></span><span></span><span></span></div>' +
      '<div class="ph-label"><span data-fr="'+s.fr+'" data-en="'+s.en+'"></span></div>';
    heroBg.appendChild(el);

    var dot = document.createElement("button");
    if(i===0) dot.className = "active";
    dot.onclick = function(){ goToSlide(i); };
    heroDots.appendChild(dot);
  });
  var slideIndex = 0;
  function goToSlide(i){
    slideIndex = i;
    Array.prototype.forEach.call(heroBg.children, function(el, idx){ el.classList.toggle("active", idx === i); });
    Array.prototype.forEach.call(heroDots.children, function(el, idx){ el.classList.toggle("active", idx === i); });
  }
  setInterval(function(){ goToSlide((slideIndex + 1) % slides.length); }, 4200);

  // ---------- Language toggle ----------
  function applyLang(){
    document.documentElement.lang = LANG;
    var nodes = document.querySelectorAll("[data-fr][data-en]");
    nodes.forEach(function(n){ n.textContent = n.getAttribute("data-" + LANG); });
    document.querySelectorAll(".opt").forEach(function(o){
      o.classList.toggle("active", o.getAttribute("data-lang-opt") === LANG);
    });
  }
  function toggleLang(){ LANG = LANG === "fr" ? "en" : "fr"; applyLang(); }
  document.getElementById("lang-toggle-desktop").addEventListener("click", toggleLang);
  document.getElementById("lang-toggle-mobile").addEventListener("click", toggleLang);
  applyLang();

  // ---------- Header scroll state + mobile menu ----------
  var header = document.getElementById("site-header");
  function onScroll(){ header.classList.toggle("scrolled", window.scrollY > 24); }
  window.addEventListener("scroll", onScroll);
  onScroll();

  var mobileToggle = document.getElementById("mobile-toggle");
  var mobilePanel = document.getElementById("mobile-panel");
  mobileToggle.addEventListener("click", function(){ mobilePanel.classList.toggle("open"); });
  mobilePanel.querySelectorAll("a").forEach(function(a){
    a.addEventListener("click", function(){ mobilePanel.classList.remove("open"); });
  });

  document.getElementById("year").textContent = new Date().getFullYear();

  // ---------- Scroll reveal ----------
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var revealObserver = ("IntersectionObserver" in window) ? new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if(entry.isIntersecting){
        entry.target.classList.add("in-view");
        revealObserver.unobserve(entry.target);
      }
    });
  }, { threshold: 0.12, rootMargin: "0px 0px -8% 0px" }) : null;

  function observeReveals(){
    document.querySelectorAll(".reveal:not(.in-view)").forEach(function(el){
      if(!revealObserver || reduceMotion){ el.classList.add("in-view"); return; }
      revealObserver.observe(el);
    });
  }
  observeReveals();

  // ---------- Animated counters ----------
  var countObserver = ("IntersectionObserver" in window) ? new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if(!entry.isIntersecting) return;
      countObserver.unobserve(entry.target);
      var el = entry.target;
      var target = parseFloat(el.getAttribute("data-count"));
      var decimals = parseInt(el.getAttribute("data-decimal") || "0", 10);
      var suffix = el.getAttribute("data-suffix") || "";
      if(reduceMotion){ el.textContent = target.toFixed(decimals) + suffix; return; }
      var start = null, duration = 1400;
      function step(ts){
        if(!start) start = ts;
        var progress = Math.min((ts - start) / duration, 1);
        var eased = 1 - Math.pow(1 - progress, 3);
        var val = target * eased;
        el.textContent = val.toFixed(decimals) + suffix;
        if(progress < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    });
  }, { threshold: 0.6 }) : null;
  document.querySelectorAll("[data-count]").forEach(function(el){
    if(!countObserver){ el.textContent = el.getAttribute("data-count") + (el.getAttribute("data-suffix")||""); return; }
    countObserver.observe(el);
  });
})();
</script>
</body>
</html>
